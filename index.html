<!DOCTYPE html>
<html>

<head>
    <title>Connect Z</title>
    <link rel="stylesheet" href="popup/style.css">
    <!-- Optional: Preconnect to font provider if we were loading external fonts, but assuming system fonts for speed/privacy mostly -->
</head>

<body>
    <h1>Connect Z</h1>

    <!-- Main Menu View -->
    <div id="mainMenu" class="fade-in">

        <!-- Login Warning / CTA (Visible when NOT logged in) -->
        <div id="loginContainer" class="message-container hidden">
            <p class="text-muted">Please login to access AI features</p>
            <button id="loginBtn" class="btn-primary">Login Now</button>
        </div>

        <!-- Features (Visible when logged in) -->
        <div id="featuresContainer" class="hidden">

            <!-- LinkedIn Warning (Only specific logic) -->
            <div id="linkedinWarning" class="warning-box hidden">
                You need to open LinkedIn to use ConnectZ
            </div>
            <button id="openLinkedInBtn" class="btn-primary hidden" style="margin-bottom: 16px;">Open LinkedIn</button>

            <div class="feature-grid">
                <button id="goToGeneratePostBtn" class="feature-btn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                    </svg>
                    <span>Generate Post</span>
                </button>
                <button id="goToGenerateCommentBtn" class="feature-btn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path
                            d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z">
                        </path>
                    </svg>
                    <span>Generate Comment</span>
                </button>
                </button>
                <button id="goToAnalyticsBtn" class="feature-btn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="20" x2="18" y2="10"></line>
                        <line x1="12" y1="20" x2="12" y2="4"></line>
                        <line x1="6" y1="20" x2="6" y2="14"></line>
                    </svg>
                    <span>Stats</span>
                </button>
            </div>
            <button id="visitDashboardBtn" class="btn-secondary"
                style="margin-top: 12px; padding: 8px; font-size: 13px;">Visit Dashboard</button>
        </div>
    </div>

    <!-- Generate Post View -->
    <div id="generatePostView" class="hidden fade-in">
        <button id="backFromPostBtn" class="btn-ghost">Back to Menu</button>
        <h2>Generate Post</h2>
        <div class="card">
            <textarea id="roughPostContent" placeholder="Enter a rough outline for your post..." rows="4"></textarea>
            <button id="generatePostBtn" class="btn-primary" style="margin-top: 12px;">Generate Post</button>
        </div>

        <div id="postResultContainer" class="card hidden">
            <label>Generated Post:</label>
            <div id="generatedPostOutput" class="result-box"></div>
            <button id="copyPostBtn" class="btn-success">Copy Text</button>
        </div>
    </div>

    <!-- Generate Comment View -->
    <div id="generateCommentView" class="hidden fade-in">
        <button id="backFromCommentBtn" class="btn-ghost">Back to Menu</button>
        <h2>Generate Comment</h2>

        <div class="card">
            <label>Post Content:</label>
            <textarea id="postContentForComment" placeholder="Paste the LinkedIn post content here..."
                rows="3"></textarea>

            <label style="margin-top: 12px;">Optional Comment:</label>
            <textarea id="optionalComment" placeholder="Enter your comment to rephrase (optional)..."
                rows="2"></textarea>

            <button id="generateCommentBtn" class="btn-primary" style="margin-top: 12px;">Generate Comment</button>
        </div>

        <div id="commentResultContainer" class="card hidden">
            <label>Generated Comment:</label>
            <div id="generatedCommentOutput" class="result-box"></div>
            <button id="copyCommentBtn" class="btn-success">Copy Text</button>
        </div>
    </div>

    <!-- Analytics View -->
    <div id="analyticsView" class="hidden fade-in">
        <button id="backFromAnalyticsBtn" class="btn-ghost">Back to Menu</button>
        <h2 style="display:flex; justify-content:space-between; align-items:center;">
            Your Progress
            <small style="font-size:12px; font-weight:400; color:var(--text-muted);" id="analyticsDate">Today</small>
        </h2>

        <!-- Stats Summary -->
        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-value" id="statToday">0</div>
                <div class="stat-label">Today</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statWeekly">0</div>
                <div class="stat-label">Week</div>
            </div>
            <div class="stat-card highlight">
                <div class="stat-value" id="statStreak">0</div>
                <div class="stat-label">Streak</div>
            </div>
        </div>

        <!-- Weekly Chart -->
        <div class="card chart-section">
            <label>Weekly Activity</label>
            <div class="chart-container" id="weeklyChart">
                <!-- Bars will be injected here -->
                <div class="loading-spinner"></div>
            </div>
        </div>

        <!-- Badges -->
        <div class="card">
            <label>Badges & Achievements</label>
            <div class="badges-grid" id="badgesGrid">
                <!-- Badges will be injected here -->
            </div>
        </div>

        <!-- Progress -->
        <div class="card">
            <label id="nextBadgeLabel">Next: 5-Day Streak</label>
            <div class="progress-container">
                <div class="progress-bar" id="nextBadgeProgress" style="width: 0%"></div>
            </div>
            <div style="text-align:right; font-size:11px; color:var(--text-secondary); margin-top:4px;"
                id="nextBadgeText">0%</div>
        </div>
    </div>

    <script type="module" src="popup/main.js"></script>
</body>

</html>
