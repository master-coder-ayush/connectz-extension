<!DOCTYPE html>
<html>
<head>
    <title>Connect Z</title>
    <style>
        body {
            width: 300px;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            margin: 0;
        }
        h1 {
            margin: 0 0 20px 0;
            font-size: 24px;
            color: #333;
        }
        #status {
            padding: 15px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            text-align: center;
            margin: 10px 0;
        }
        .logged-in {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .logged-out {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .checking {
            background-color: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }
        button:hover {
            background-color: #0056b3;
        }
        #loginBtn {
            background-color: #28a745;
        }
        #loginBtn:hover {
            background-color: #218838;
        }
        #openLinkedInBtn {
            background-color: #0077b5;
        }
        #openLinkedInBtn:hover {
            background-color: #005885;
        }
    </style>
</head>
<body>
    <h1>Connect Z</h1>
    <div id="status" class="checking">Checking...</div>
    <div id="linkedinWarning" style="display: none; padding: 15px; background-color: #fff3cd; color: #856404; border: 1px solid #ffeaa7; border-radius: 8px; margin: 10px 0; font-size: 14px; text-align: center;">
        You need to open LinkedIn to use ConnectZ
    </div>
    <button id="refreshBtn">Refresh Status</button>
    <button id="loginBtn" style="display: none;">Login Now</button>
    <button id="openLinkedInBtn" style="display: none; background-color: #0077b5;">Open LinkedIn</button>
    <script src="popup.js"></script>
</body>
</html>
